<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Prediction</title>
    <link rel="preconnect" href="https://image.tmdb.org" />
    <meta name="description" content="Plan a film and get honest budget, box office and audience score ranges from 79,199 past films, with the reasons behind them. Browse the films too." />
    <script>
      // Set the theme before the page draws, so it doesn't flash: the saved choice (next-themes' "theme" key),
      // else the system preference. src/app/theme.tsx keeps it in sync after React starts.
      try {
        var t = localStorage.getItem('theme')
        var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
