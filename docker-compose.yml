# The app's services: the app's one image (Day 15: the API and the built React app on one origin, the same
# image Render runs) and Postgres for the demo account (Day 14; live, the API uses Neon instead). The user data
# survives `docker compose down` in the userdb volume.
#
#   make docker-build         # slim database + the image
#   docker compose pull app   # or the image from GHCR, for a clean clone without the data (docker login ghcr.io)
#   make docker-run           # docker compose up -d, then waits for the healthchecks
#   make smoke                # scripts/smoke.py against the API on :8000 and the app on :8080
#   docker compose down
#   docker compose up -d --wait db   # Postgres alone, on :5432 (make test-pg; make api with USER_DATABASE_URL)
services:
  db:
    image: postgres:18
    container_name: movie-prediction-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: movies
      POSTGRES_PASSWORD: movies  # local only; the live database is Neon's, with its own password
      POSTGRES_DB: movies
    volumes:
      - userdb:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movies -d movies"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${IMAGE:-ghcr.io/tsomaros/movie-prediction:latest}
    container_name: movie-prediction
    ports:
      - "8000:8000"  # the API (make smoke's URL)
      - "8080:8000"  # the same server as the app's address (make smoke's WEB, Playwright)
    environment:
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"  # the Vite dev server; the app on :8080
      RATE_LIMIT: "30"
      CACHE_SIZE: "1000"
      USER_DATABASE_URL: "postgresql://movies:movies@db:5432/movies"
      TMDB_READ_TOKEN: "${TMDB_READ_TOKEN:-}"  # from .env: new and upcoming films merged in (V1.2); empty: none
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  userdb:
